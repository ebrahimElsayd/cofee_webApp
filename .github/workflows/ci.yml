name: Customer app CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production app
        run: npm run build
